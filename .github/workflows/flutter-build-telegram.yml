name: Build Flutter AAB and APK, Publish Release, and Send to Telegram 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/cirruslabs/flutter:stable
      options: --privileged

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Android SDK components
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip sdk.zip -d "$ANDROID_HOME/cmdline-tools/temp"
          mv "$ANDROID_HOME/cmdline-tools/temp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf "$ANDROID_HOME/cmdline-tools/temp"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
        
      - name: Install dependencies
        working-directory: alumni_network_app
        run: flutter pub get

      - name: Clean project
        working-directory: alumni_network_app
        run: flutter clean

      - name: Analyze project
        working-directory: alumni_network_app
        run: |
          flutter analyze > analysis.log || true
          cat analysis.log
          if grep -q "error •" analysis.log; then
            echo "❌ Flutter analysis failed"
            exit 1
          else
            echo "✅ Flutter analysis passed"
          fi

      - name: Build APK (Split‑per‑ABI)
        working-directory: alumni_network_app
        run: flutter build apk --release --split-per-abi

      - name: Send APK to Telegram
        if: success()
        working-directory: alumni_network_app
        env:
          BOT_TOKEN: 8640322510:AAHOBHKgddKGU1kyRXDVbq2zxu4Zir7dFoI
          CHAT_ID: 8000518889
        run: |
          curl -F document=@build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
               -F chat_id="$CHAT_ID" \
               -F caption="📱 APK Build (arm64-v8a) — ${{ github.actor }} on branch `${{ github.ref_name }}`" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"